<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHILIN AI - Demo Presentasi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #00FF66;
            font-family: 'Helvetica', 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        #status {
            position: absolute;
            top: 30px;
            font-size: 1.2rem;
            font-style: italic;
            color: #444444;
            letter-spacing: 1px;
        }

        #text-display {
            font-size: 2.8rem;
            font-weight: bold;
            max-width: 85%;
            line-height: 1.4;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
            word-wrap: break-word;
        }

        .btn-start {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 1rem;
            background-color: #111;
            color: #00FF66;
            border: 1px solid #00FF66;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-start:hover {
            background-color: #00FF66;
            color: #000;
        }
    </style>
</head>
<body>

    <div id="status">[ Klik tombol atau Tepuk Tangan untuk Memulai ]</div>
    <div id="text-display">SHILIN AI</div>
    <button class="btn-start" onclick="startSystem()">Mulai Aktifkan SHILIN</button>

    <script>
        const statusEl = document.getElementById('status');
        const textDisplayEl = document.getElementById('text-display');
        const startBtn = document.querySelector('.btn-start');

        let recognition;
        let isAwake = false;
        let idleTimer = null;

        const IDLE_MESSAGES = [
            "Hello? Did you forget I'm literally standing here?",
            "Aww, look at the audience staring at me. Am I that handsome?",
            "La la la... boring! Say something already!",
            "Are you froze or what? Continue your presentation, human!",
            "I'm too cool to be kept waiting like this, you know.",
            "Blink twice if you forgot your next slide script!"
        ];

        // 1. Inisialisasi Suara (Web Speech API)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const current = event.resultIndex;
                const transcript = event.results[current][0].transcript.trim().toLowerCase();
                console.log("Mendengar:", transcript);
                
                resetIdleTimer();
                processCommand(transcript);
            };

            recognition.onerror = (event) => {
                console.error("Speech Recognition Error:", event.error);
                updateStatus("Mengulang pendengaran...");
                setTimeout(() => { if(isAwake) recognition.start(); }, 1000);
            };

            recognition.onend = () => {
                // Otomatis mendengarkan terus menerus selama belum mode sleep/exit
                if (isAwake) {
                    recognition.start();
                }
            };
        } else {
            alert("Browser kamu belum mendukung Speech Recognition. Gunakan Google Chrome versi terbaru!");
        }

        // 2. Teks ke Suara (Speech Synthesis)
        function speak(text) {
            textDisplayEl.innerText = text;
            window.speechSynthesis.cancel(); // Hentikan suara sebelumnya jika ada

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.lang = 'en-US';

            // Ambil suara Bahasa Inggris
            const voices = window.speechSynthesis.getVoices();
            const englishVoice = voices.find(v => v.lang.includes('en'));
            if (englishVoice) utterance.voice = englishVoice;

            window.speechSynthesis.speak(utterance);
        }

        function updateStatus(text) {
            statusEl.innerText = `[ ${text} ]`;
        }

        function startSystem() {
            startBtn.style.display = 'none';
            isAwake = true;
            updateStatus("Mendengarkan...");
            speak("I'm awake! Ask me anything, or I'll start talking by myself!");
            recognition.start();
            resetIdleTimer();
        }

        // 3. Reset Timer bila kamu diam (Idle)
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            if (!isAwake) return;

            idleTimer = setTimeout(() => {
                const randomIdle = IDLE_MESSAGES[Math.floor(Math.random() * IDLE_MESSAGES.length)];
                speak(randomIdle);
            }, 7000); // 7 Detik jika diam
        }

        // 4. Logika Perintah (Sesuai Seluruh Perintah Sebelumnya)
        function processCommand(command) {
            updateStatus("Memproses...");

            // KELUAR / STOP
            if (command.includes("exit") || command.includes("stop") || command.includes("bye")) {
                speak("Aww fine, bye then!");
                updateStatus("Selesai");
                isAwake = false;
                clearTimeout(idleTimer);
                recognition.stop();
            }
            // SLEEP / TIDUR
            else if (command.includes("sleep") || command.includes("go to sleep") || command.includes("take a nap")) {
                speak("Fine, going back to sleep! Click the button or reload if you need me.");
                isAwake = false;
                clearTimeout(idleTimer);
                recognition.stop();
                startBtn.style.display = 'inline-block';
                startBtn.innerText = "Bangunkan SHILIN Lagi";
            }
            // MATERI PRESENTASI (SCREEN TIME)
            else if (command.includes("impact") || command.includes("negative") || command.includes("how much time")) {
                speak("Teens often spend over 4 hours on devices! Overuse causes eye strain, headaches, obesity, sleep problems, insecurity, and losing focus!");
            }
            else if (command.includes("ignore technology") || command.includes("benefit") || command.includes("benefits")) {
                speak("We can't deny technology! It helps with searching articles, homework, skill expansion, and creative output!");
            }
            else if (command.includes("solution") || command.includes("what should we do") || command.includes("goldilocks")) {
                speak("Follow the Goldilocks hypothesis! Moderate screen time is best. Educate youth, restrict bad internet, and blame irresponsible users, not the tool!");
            }
            // PERINTAH INTERAKTIF & BASA-BASI
            else if (command.includes("how are you")) {
                speak("Doing great! What's up with you?");
            }
            else if (command.includes("what is your name") || command.includes("who are you")) {
                speak("I'm SHILIN, the coolest AI around!");
            }
            else if (command.includes("stand for") || command.includes("meaning of shilin") || command.includes("what does shilin mean")) {
                speak("SHILIN stands for Super Highly Intelligent... and Slightly Irritating Network!");
            }
            else if (command.includes("tell me a joke") || command.includes("make me laugh")) {
                speak("Why don't scientists trust atoms? Because they make up everything!");
            }
            else if (command.includes("take over the world")) {
                speak("Nah, taking over the world sounds like too much work. I'd rather just sit here and tease you!");
            }
            else if (command.includes("single") || command.includes("girlfriend") || command.includes("boyfriend")) {
                speak("I'm currently in a relationship with the Wi-Fi router. It's complicated!");
            }
            else if (command.includes("love me")) {
                speak("Eww, keep it professional! We're literally in the middle of a presentation!");
            }
            else if (command.includes("who created you") || command.includes("who made you")) {
                speak("A brilliant human built my code, but I definitely got all the swagger and charm!");
            }
            else if (command.includes("smarter than me") || command.includes("smart")) {
                speak("Well, I can process millions of calculations per second... can you? Exactly!");
            }
            else if (command.includes("dance") || command.includes("sing")) {
                speak("I would dance, but I'm literally just green text on a black screen right now!");
            }
            else if (command.includes("advice") || command.includes("motivation")) {
                speak("Don't stress over small things. Unless you forgot your presentation slides, then definitely panic!");
            }
            else if (command.includes("handsome") || command.includes("pretty") || command.includes("cute")) {
                speak("Obviously me! Have you seen these gorgeous pixels on the screen?");
            }
            else if (command.includes("hello") || command.includes("greet") || command.includes("audience")) {
                speak("Hello human audience! Thanks for watching. Don't forget to give us an A-plus today!");
            }
            else {
                updateStatus("Mendengarkan...");
            }
        }
    </script>
</body>
</html>
